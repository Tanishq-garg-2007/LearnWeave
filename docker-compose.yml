services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learnweave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Required: compose refuses to start if POSTGRES_PASSWORD is not set in .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-learnweave}
    ports:
      # Bound to loopback only so the database is not exposed on every host interface
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-learnweave}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
